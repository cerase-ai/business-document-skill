# Registry display text in the platform's other locales.
#
# The base fields -- SKILL.md's `description` and cerase.json's -- are the SOURCE
# locale and are English; package_translations forbids a row for it, so this file
# can only ever hold the others. It is registry metadata: the seeder keeps it out
# of the bundle that ships to the agent.
it:
  display_name: "Documenti di lavoro"
  description: "Si applica quando la persona chiede un preventivo, un'offerta, una proposta per una gara, una relazione, una lettera commerciale o un altro documento scritto per un cliente o per la direzione, e quando un testo va inserito in un documento che esiste già, come un Google Doc o una carta intestata. Costruisce il documento in cinque fasi: un brief, una scaletta concordata con la persona, una bozza in Markdown, una revisione che ricalcola ogni cifra con la calcolatrice e riconduce ogni affermazione alla sua fonte, e un PDF ricavato dal Markdown e consegnato come allegato. Non per una presentazione, che è la skill deck, né per il testo di un'email, che è email-drafting."
